server:
  port: 8086
  address: 0.0.0.0

spring:
  application:
    name: API-GATEWAY

  cloud:
    loadbalancer:
      cache:
        enabled: true
        ttl: 35s
        capacity: 256
      retry:
        enabled: false
    gateway:
      forwarded-headers-strategy: framework
      
      # HTTP Client Configuration for timeouts - INCREASED for stability
      httpclient:
        connect-timeout: 60000  # 60 seconds connection timeout (milliseconds)
        response-timeout: 60s   # 60 seconds response timeout
        pool:
          type: ELASTIC
          max-connections: 500
          max-idle-time: 20s
        compression: true
        wiretap: false
        ssl:
          use-insecure-trust-manager: false

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: false
            maxAge: 3600

      routes:
        - id: quiz-service
          uri: lb://QUIZ-SERVICE
          predicates:
            - Path=/api/v1/quiz/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: quizService
                fallbackUri: forward:/fallback/quiz

        - id: question-service
          uri: lb://QUESTION-SERVICE
          predicates:
            - Path=/api/v1/question/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: questionService
                fallbackUri: forward:/fallback/question

        - id: participation-service
          uri: lb://PARTICIPATION-SERVICE
          predicates:
            - Path=/api/v1/participation/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: participationService
                fallbackUri: forward:/fallback/participation

        - id: leaderboard-service
          uri: lb://LEADERBOARD
          predicates:
            - Path=/api/v1/leaderboard/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: leaderboardService
                fallbackUri: forward:/fallback/leaderboard

        - id: bugreport-service
          uri: lb://BUGREPORT-SERVICE
          predicates:
            - Path=/api/v1/bugs/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: bugReportService
                fallbackUri: forward:/fallback/bugreport

        - id: blog-service
          uri: lb://BLOG-SERVICE
          predicates:
            - Path=/api/v1/posts/**,/api/v1/categories/**,/api/v1/tags/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: blogService
                fallbackUri: forward:/fallback/blog

        - id: user-auth
          uri: lb://USER-AUTH
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE,INTERNAL_SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: judge-service
          uri: lb://JAVA-JUDGE
          predicates:
            - Path=/api/v1/judge/**
          filters:
            - RewritePath=/api/v1/judge/(?<segment>.*), /api/${segment}
            - AuthenticationFilter
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE,INTERNAL_SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: false
          metadata:
            response-timeout: 60s

  main:
    web-application-type: reactive

# Shorten stale instance eviction time (dev-friendly)
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: "*"

resilience4j:
  circuitbreaker:
    instances:
      quizService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

      questionService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

      participationService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

      leaderboardService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

      bugReportService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

      userAuth:
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 3s
        permittedNumberOfCallsInHalfOpenState: 5
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 60s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException

      blogService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud: INFO
    com.netflix.discovery: INFO

